<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
</head>

<body>

    <div>
        <h2>Inventario de productos</h2>

        <form>

            <label for="codigo">Código:</label>
            <input type="text" id="codigo">

            <br><br>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre">

            <br><br>

            <label for="cantidad">Cantidad:</label>
            <input type="text" id="cantidad">

            <br><br>

            <label for="costo">Costo:</label>
            <input type="text" id="costo">

            <br><br>

            <button type="button" id="agregar">Agregar</button>
            <button type="button" id="listar">Listar</button>
            <button type="button" id="buscar">Buscar</button>
            <button type="button" id="eliminar">Eliminar</button>
            <button type="button" id="extraerPrimero">Extraer primero</button>
            <button type="button" id="extraerUltimo">Extraer último</button>
            <button type="button" id="listarInverso">Listar inverso</button>
            <button type="button" id="cancelar">Cancelar</button>

        </form>

        <div id="detalles"></div>

    </div>

    <script src="Producto.js"></script>
    <script src="Inventario.js"></script>
    <script src="app.js"></script>

</body>
</html>
